<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product | Taste of Home</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background: #f5f5ef;
            color: #28372d;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #304936;
            text-decoration: none;
            font-weight: 700;
        }

        .card {
            padding: 35px;
            background: white;
            border: 1px solid #e2e5dc;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(36,56,42,.05);
        }

        h1 {
            margin-top: 0;
            color: #24382a;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 32px;
        }

        .current-image {
            margin-bottom: 25px;
        }

        .current-image img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #405044;
            font-weight: 700;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9ded5;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 9px;
            background: #304936;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #24382a;
        }

    </style>

</head>

<body>

<div class="container">

    <a
        href="/admin/products"
        class="back"
    >
        ← Back to Products
    </a>

    <div class="card">

        <h1>
            Edit Product
        </h1>

        <form
            action="/admin/products/edit/{{ product.id }}"
            method="post"
            enctype="multipart/form-data"
        >

            <div class="field">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ product.name }}"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                >{{ product.description or "" }}</textarea>

            </div>


            <div class="field">

                <label>
                    Price
                </label>

                <input
                    type="number"
                    name="price"
                    step="0.01"
                    value="{{ product.price }}"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Category
                </label>

                <input
                    type="text"
                    name="category"
                    value="{{ product.category or "" }}"
                >

            </div>


            <div class="field">

                <label>
                    Stock
                </label>

                <input
                    type="number"
                    name="stock"
                    value="{{ product.stock or 0 }}"
                    min="0"
                >

            </div>


            {% if product.image %}

            <div class="current-image">

                <label>
                    Current Image
                </label>

                <img
                    src="{{ url_for('static', path='images/' ~ product.image) }}"
                    alt="{{ product.name }}"
                >

            </div>

            {% endif %}


            <div class="field">

                <label>
                    Replace Image
                </label>

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

                <small>
                    Leave empty to keep the current image.
                </small>

            </div>


            <div class="field checkbox">

                <input
                    type="checkbox"
                    name="is_active"
                    value="true"
                    {% if product.is_active %}checked{% endif %}
                >

                <label style="margin:0;">
                    Product is active
                </label>

            </div>


            <button type="submit">
                Save Product Changes
            </button>

        </form>

    </div>

</div>

</body>

</html>
