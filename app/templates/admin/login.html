<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Taste of Home</title>

</head>

<body>

<div class="admin-login-page">

    <div class="login-card">

        <div class="brand-mark">
            TH
        </div>

        <div class="brand-name">
            TASTE OF HOME
        </div>

        <div class="admin-label">
            ADMINISTRATION
        </div>

        <h1>
            Welcome back
        </h1>

        <p class="subtitle">
            Sign in to manage your store.
        </p>


        <form
            action="/admin/login"
            method="post"
        >

            <div class="field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password"
                >

            </div>


            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <button
                type="submit"
                class="login-button"
            >
                Sign in to Dashboard
            </button>

        </form>


        <div class="security-note">

            <span>●</span>

            Secure administrator access

        </div>

    </div>

</div>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #f6f5ef;

    color:
        #28372d;
}


.admin-login-page {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 30px 20px;

    background:
        radial-gradient(
            circle at top left,
            rgba(111, 132, 104, 0.13),
            transparent 35%
        ),
        #f6f5ef;
}


.login-card {

    width: 100%;

    max-width: 430px;

    padding: 45px 42px 38px;

    background: #ffffff;

    border: 1px solid #e5e5dc;

    border-radius: 20px;

    box-shadow:
        0 20px 55px rgba(36, 56, 42, 0.10);

    text-align: center;
}


.brand-mark {

    width: 54px;

    height: 54px;

    margin: 0 auto 13px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 14px;

    background:
        #24382a;

    color: #ffffff;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 1px;
}


.brand-name {

    color: #24382a;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2.5px;
}


.admin-label {

    margin-top: 9px;

    color: #b18a4b;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 2px;
}


h1 {

    margin: 28px 0 7px;

    color: #24382a;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 30px;

    font-weight: 600;
}


.subtitle {

    margin: 0 0 30px;

    color: #858c83;

    font-size: 12px;

    line-height: 1.5;
}


.field {

    margin-bottom: 18px;

    text-align: left;
}


.field label {

    display: block;

    margin-bottom: 7px;

    color: #526250;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .5px;
}


.field input {

    width: 100%;

    height: 47px;

    padding: 0 14px;

    border: 1px solid #dfe3da;

    border-radius: 9px;

    outline: none;

    background: #fafbf8;

    color: #344337;

    font-family: inherit;

    font-size: 12px;

    transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}


.field input:focus {

    border-color: #78906f;

    background: #ffffff;

    box-shadow:
        0 0 0 3px rgba(111, 132, 104, .10);
}


.field input::placeholder {

    color: #a7ada5;
}


.error-message {

    margin: 4px 0 18px;

    padding: 11px 12px;

    border: 1px solid #ead4d0;

    border-radius: 8px;

    background: #fbf2f0;

    color: #a25349;

    font-size: 10px;

    text-align: left;
}


.login-button {

    width: 100%;

    height: 49px;

    margin-top: 7px;

    border: 0;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #304936,
            #24382a
        );

    color: #ffffff;

    cursor: pointer;

    font-family: inherit;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .3px;

    box-shadow:
        0 8px 20px rgba(36, 56, 42, .16);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}


.login-button:hover {

    transform: translateY(-1px);

    box-shadow:
        0 11px 25px rgba(36, 56, 42, .22);
}


.security-note {

    margin-top: 25px;

    color: #9aa098;

    font-size: 9px;

    letter-spacing: .2px;
}


.security-note span {

    margin-right: 5px;

    color: #718b68;
}


@media (max-width: 500px) {

    .login-card {

        padding: 35px 23px 30px;

        border-radius: 16px;
    }


    h1 {

        font-size: 27px;
    }

}

</style>

</body>

</html>
