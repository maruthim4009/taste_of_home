<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Taste of Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background: #f8f5ef;

            color: #171717;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        /* =================================================
           MAIN PAGE
           ================================================= */

        .page {
            width: 100%;
            max-width: 460px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =================================================
           BRAND
           ================================================= */

        .brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            width: 56px;
            height: 56px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;

            border: 1px solid #222222;
            border-radius: 12px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 22px;
            font-weight: 700;

            letter-spacing: 1px;

            color: #17202a;
        }

        .brand-name {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 30px;
            font-weight: 500;

            line-height: 1.2;

            color: #111111;
        }

        .tagline {
            margin-top: 6px;

            font-size: 10px;
            font-weight: 500;

            letter-spacing: 2px;

            color: #777777;
        }


        /* =================================================
           CARD
           ================================================= */

        .card {
            width: 100%;

            background: #ffffff;

            border: 1px solid #e4dfd6;

            border-radius: 17px;

            padding: 31px 33px 30px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.045);
        }


        /* =================================================
           HEADING
           ================================================= */

        h1 {
            margin: 0;

            text-align: center;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 27px;
            font-weight: 700;

            color: #17202a;
        }

        .subtitle {
            max-width: 330px;

            margin: 8px auto 27px;

            text-align: center;

            font-size: 14px;
            line-height: 1.55;

            color: #707070;
        }


        /* =================================================
           FORM
           ================================================= */

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;

            color: #161616;
        }


        /* =================================================
           INPUTS
           ================================================= */

        input {
            width: 100%;
            height: 50px;

            padding: 0 14px;

            border: 1px solid #d9d4cc;

            border-radius: 9px;

            background: #ffffff;

            color: #202020;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #8a8a8a;
        }

        input:focus {
            border-color: #252525;

            box-shadow:
                0 0 0 2px rgba(34, 34, 34, 0.05);
        }


        /* =================================================
           MOBILE NUMBER
           ================================================= */

        .mobile-row {
            display: flex;

            gap: 9px;

            width: 100%;
        }


        /* =================================================
           INDIA +91 SELECTOR
           ================================================= */

        .country-code {
            width: 91px;
            min-width: 91px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            background: #faf9f7;

            border: 1px solid #d9d4cc;

            border-radius: 9px;

            color: #202020;

            font-size: 13px;
            font-weight: 600;

            user-select: none;
        }


        /* =================================================
           INDIAN FLAG - CSS
           ================================================= */

        .india-flag {
            width: 21px;
            height: 14px;

            position: relative;

            display: inline-block;

            border-radius: 2px;

            overflow: hidden;

            border: 1px solid rgba(0, 0, 0, 0.12);

            flex-shrink: 0;

            background:
                linear-gradient(
                    to bottom,
                    #ff9933 0%,
                    #ff9933 33.33%,
                    #ffffff 33.33%,
                    #ffffff 66.66%,
                    #138808 66.66%,
                    #138808 100%
                );
        }

        /* Ashoka Chakra */
        .india-flag::after {
            content: "";

            position: absolute;

            width: 4px;
            height: 4px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 1px solid #000080;

            border-radius: 50%;
        }

        .mobile-input {
            flex: 1;

            min-width: 0;
        }


        /* =================================================
           BUTTON
           ================================================= */

        button {
            width: 100%;
            height: 50px;

            border: none;

            border-radius: 9px;

            background: #242424;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease,
                opacity 0.2s ease;
        }

        button:hover {
            background: #111111;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.60;

            cursor: not-allowed;

            transform: none;
        }


        /* =================================================
           OTP SECTION
           ================================================= */

        #otpSection {
            display: none;

            margin-top: 22px;
            padding-top: 22px;

            border-top: 1px solid #eeeeee;
        }

        .otp-description {
            margin: -3px 0 17px;

            text-align: center;

            font-size: 13px;

            color: #777777;
        }

        .otp-input {
            text-align: center;

            letter-spacing: 7px;

            font-size: 21px;
            font-weight: 700;

            padding-left: 20px;
        }


        /* =================================================
           MESSAGE
           ================================================= */

        .message {
            display: none;

            margin-top: 16px;

            padding: 11px 13px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.45;

            text-align: center;
        }

        .message.success {
            display: block;

            background: #eef8f1;

            border: 1px solid #cde9d5;

            color: #176b35;
        }

        .message.error {
            display: block;

            background: #fff2f2;

            border: 1px solid #f0cece;

            color: #a52222;
        }


        /* =================================================
           LOGIN LINK
           ================================================= */

        .login-link {
            margin-top: 20px;

            text-align: center;

            font-size: 13px;

            color: #222222;
        }

        .login-link a {
            color: #171717;

            font-weight: 700;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }


        /* =================================================
           MOBILE RESPONSIVE
           ================================================= */

        @media (max-width: 520px) {

            body {
                padding: 22px 15px;
            }

            .brand {
                margin-bottom: 20px;
            }

            .brand-name {
                font-size: 27px;
            }

            .card {
                padding: 27px 21px 25px;

                border-radius: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 13px;

                margin-bottom: 23px;
            }

            .country-code {
                width: 84px;
                min-width: 84px;
            }
        }


        @media (max-width: 360px) {

            .country-code {
                width: 79px;
                min-width: 79px;

                gap: 5px;

                font-size: 12px;
            }

            .india-flag {
                width: 20px;
                height: 13px;
            }

            .mobile-row {
                gap: 6px;
            }
        }
        .resend-button {
    margin-top: 10px;

    background: transparent;
    color: #242424;

    border: 1px solid #d9d4cc;

    font-size: 14px;
    font-weight: 600;
}

.resend-button:hover {
    background: #faf9f7;
}

.resend-button:disabled {
    background: #faf9f7;
    color: #999999;
    border-color: #e5e1db;
    opacity: 1;
    cursor: not-allowed;
}

    </style>
</head>


<body>

<div class="page">


    <!-- =================================================
         BRAND
         ================================================= -->

    <div class="brand">

        <div class="logo">
            TH
        </div>

        <div class="brand-name">
            Taste of Home
        </div>

        <div class="tagline">
            HOMEMADE FOOD · REAL FLAVORS
        </div>

    </div>


    <!-- =================================================
         RESET PASSWORD CARD
         ================================================= -->

    <div class="card">

        <h1>
            Reset Password
        </h1>

        <div class="subtitle">
            Enter your registered mobile number and create a
            new password.
        </div>


        <!-- =================================================
             MOBILE NUMBER
             ================================================= -->

        <div class="field">

            <label for="mobile">
                Mobile Number
            </label>

            <div class="mobile-row">

                <div class="country-code">

                    <span class="india-flag"></span>

                    <span>+91</span>

                </div>

                <input
                    id="mobile"
                    class="mobile-input"
                    type="tel"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="10-digit mobile number"
                    autocomplete="tel"
                >

            </div>

        </div>


        <!-- =================================================
             NEW PASSWORD
             ================================================= -->

        <div class="field">

            <label for="newPassword">
                New Password
            </label>

            <input
                id="newPassword"
                type="password"
                placeholder="Enter new password"
                autocomplete="new-password"
            >

        </div>


        <!-- =================================================
             CONFIRM PASSWORD
             ================================================= -->

        <div class="field">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm new password"
                autocomplete="new-password"
            >

        </div>


        <!-- =================================================
             SEND OTP
             ================================================= -->

        <button
            id="sendOtpButton"
            type="button"
            onclick="sendOTP()"
        >
            Send OTP
        </button>


        <!-- =================================================
             OTP SECTION
             ================================================= -->

        <div id="otpSection">

            <div class="otp-description">
                Enter the OTP sent to your mobile number.
            </div>

            <div class="field">

                <label for="otp">
                    OTP
                </label>

                <input
                    id="otp"
                    class="otp-input"
                    type="text"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="••••••"
                    autocomplete="one-time-code"
                >

            </div>


            <!-- =================================================
                 VERIFY + RESET
                 ================================================= -->
<button
    id="verifyButton"
    type="button"
    onclick="verifyOTP()"
>
    Verify OTP & Reset Password
</button>

<button
    id="resendButton"
    type="button"
    class="resend-button"
    onclick="resendOTP()"
    disabled
>
    Resend OTP in <span id="resendTimer">30</span>s
</button>

        </div>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =================================================
             LOGIN
             ================================================= -->

        <div class="login-link">

            Remember your password?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>


<script>

    let otpSessionId = "";
    let resendTimerInterval = null;
    let resendSeconds = 60;


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;
    }


    /* =====================================================
       SEND OTP
       ===================================================== */

    async function sendOTP() {

        const mobile =
            document
                .getElementById("mobile")
                .value
                .trim();

        const newPassword =
            document
                .getElementById("newPassword")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        /* -------------------------------------------------
           MOBILE VALIDATION
           ------------------------------------------------- */

        if (!/^\d{10}$/.test(mobile)) {

            showMessage(
                "Please enter a valid 10-digit mobile number.",
                "error"
            );

            return;
        }


        /* -------------------------------------------------
           PASSWORD VALIDATION
           ------------------------------------------------- */

        if (newPassword.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        const button =
            document.getElementById(
                "sendOtpButton"
            );


        button.disabled = true;

        button.textContent =
            "Sending OTP...";
            startResendTimer();


        try {

            const response =
                await fetch(
                    "/forgot-password/send-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                mobile_number: mobile,
                                new_password: newPassword,
                                confirm_password: confirmPassword
                            })
                    }
                );


            const data =
                await response.json();


            /* -------------------------------------------------
               SERVER ERROR
               ------------------------------------------------- */

            if (!data.success) {

                showMessage(
                    data.message ||
                    "Unable to send OTP.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Send OTP";

                return;
            }


            /* -------------------------------------------------
               SAVE OTP SESSION
               ------------------------------------------------- */

            otpSessionId =
                data.session_id ||
                data.SessionId ||
                data.Details ||
                "";


            if (!otpSessionId) {

                showMessage(
                    "OTP session was not received. Please try again.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Send OTP";

                return;
            }


            /* -------------------------------------------------
               SHOW OTP SECTION
               ------------------------------------------------- */

            document.getElementById(
                "otpSection"
            ).style.display = "block";


            document.getElementById(
                "otp"
            ).focus();


            showMessage(
                "OTP sent successfully to your mobile number.",
                "success"
            );


            button.textContent =
                "OTP Sent";


        } catch (error) {

            console.error(
                "SEND OTP ERROR:",
                error
            );


            showMessage(
                "Unable to send OTP. Please try again.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Send OTP";
        }

    }
    function startResendTimer() {

    const resendButton =
        document.getElementById("resendButton");

    const timer =
        document.getElementById("resendTimer");

    clearInterval(resendTimerInterval);

    resendSeconds = 60;

    resendButton.disabled = true;

    resendButton.innerHTML =
        'Resend OTP in <span id="resendTimer">60</span>s';

    resendTimerInterval = setInterval(function () {

        resendSeconds--;

        const currentTimer =
            document.getElementById("resendTimer");

        if (currentTimer) {
            currentTimer.textContent =
                resendSeconds;
        }

        if (resendSeconds <= 0) {

            clearInterval(resendTimerInterval);

            resendButton.disabled = false;

            resendButton.textContent =
                "Resend OTP";
        }

    }, 1000);
}
async function resendOTP() {

    const mobile =
        document
            .getElementById("mobile")
            .value
            .trim();

    const newPassword =
        document
            .getElementById("newPassword")
            .value;

    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;

    if (!/^\d{10}$/.test(mobile)) {

        showMessage(
            "Please enter a valid 10-digit mobile number.",
            "error"
        );

        return;
    }

    if (newPassword.length < 6) {

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }

    if (newPassword !== confirmPassword) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }

    const button =
        document.getElementById("resendButton");

    button.disabled = true;

    button.textContent =
        "Sending OTP...";

    try {

        const response =
            await fetch(
                "/forgot-password/send-otp",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body:
                        new URLSearchParams({
                            mobile_number: mobile,
                            new_password: newPassword,
                            confirm_password: confirmPassword
                        })
                }
            );

        const data =
            await response.json();


        if (!data.success) {

            showMessage(
                data.message ||
                "Unable to resend OTP.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Resend OTP";

            return;
        }


        /*
         * IMPORTANT:
         * Save the NEW OTP session ID.
         *
         * The old OTP session must no longer
         * be used for verification.
         */

        otpSessionId =
            data.session_id ||
            data.SessionId ||
            data.Details ||
            "";


        if (!otpSessionId) {

            showMessage(
                "OTP session was not received. Please try again.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Resend OTP";

            return;
        }


        document.getElementById("otp").value = "";


        showMessage(
            "A new OTP has been sent to your mobile number.",
            "success"
        );


        startResendTimer();


        document
            .getElementById("otp")
            .focus();

    } catch (error) {

        console.error(
            "RESEND OTP ERROR:",
            error
        );

        showMessage(
            "Unable to resend OTP. Please try again.",
            "error"
        );

        button.disabled = false;

        button.textContent =
            "Resend OTP";
    }
}


    /* =====================================================
       VERIFY OTP + RESET PASSWORD
       ===================================================== */

    async function verifyOTP() {

        const mobile =
            document
                .getElementById("mobile")
                .value
                .trim();

        const otp =
            document
                .getElementById("otp")
                .value
                .trim();

        const newPassword =
            document
                .getElementById("newPassword")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        /* -------------------------------------------------
           OTP VALIDATION
           ------------------------------------------------- */

        if (!/^\d{4,6}$/.test(otp)) {

            showMessage(
                "Please enter the OTP sent to your mobile.",
                "error"
            );

            return;
        }


        /* -------------------------------------------------
           PASSWORD VALIDATION
           ------------------------------------------------- */

        if (newPassword.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        if (!otpSessionId) {

            showMessage(
                "OTP session is missing. Please send OTP again.",
                "error"
            );

            return;
        }


        const button =
            document.getElementById(
                "verifyButton"
            );


        button.disabled = true;

        button.textContent =
            "Verifying...";


        try {

            const response =
                await fetch(
                    "/forgot-password/verify-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                mobile_number: mobile,
                                otp_code: otp,
                                session_id: otpSessionId,
                                new_password: newPassword,
                                confirm_password: confirmPassword
                            })
                    }
                );


            const data =
                await response.json();


            /* -------------------------------------------------
               OTP FAILED
               ------------------------------------------------- */

            if (!data.success) {

                showMessage(
                    data.message ||
                    "Invalid OTP. Please try again.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Verify OTP & Reset Password";

                return;
            }


            /* -------------------------------------------------
               PASSWORD RESET SUCCESS
               ------------------------------------------------- */

            showMessage(
                "Password reset successfully. Redirecting to login...",
                "success"
            );


            /*
             * IMPORTANT:
             *
             * The backend has already:
             *
             * 1. Verified OTP
             * 2. Found the customer
             * 3. Changed password_hash
             * 4. Saved the new password
             *
             * Now redirect to login.
             */


            setTimeout(
                function () {

                    window.location.href =
                        "/login";

                },
                1200
            );

        } catch (error) {

            console.error(
                "VERIFY OTP ERROR:",
                error
            );


            showMessage(
                "Unable to verify OTP. Please try again.",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Verify OTP & Reset Password";
        }

    }


    /* =====================================================
       ONLY ALLOW NUMBERS IN MOBILE
       ===================================================== */

    document
        .getElementById("mobile")
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 10);

            }
        );


    /* =====================================================
       ONLY ALLOW NUMBERS IN OTP
       ===================================================== */

    document
        .getElementById("otp")
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 6);

            }
        );

</script>

</body>
</html>
